<div class="profile-info">
    <img src="{{ user.get_avatar_url }}" alt="Avatar" style="width: 100px; border-radius: 50%;">
    <h1>{{ user.username }}</h1>
    <p>Роль: {{ user.get_role_display }}</p>
    
    <a href="{% url 'edit_profile' %}" class="btn">Редагувати профіль</a>
</div>

<div style="margin-bottom: 20px;">
    <a href="{% url 'home' %}" style="display: inline-block; padding: 10px 15px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px;">
        ← На головну
    </a>
</div>
