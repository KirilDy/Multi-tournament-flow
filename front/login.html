<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournamates — Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ═══ NAVBAR ═══ -->
  <header class="navbar">
    <a href="index.html" class="navbar__logo">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="10" fill="rgba(255,255,255,0.15)"/>
        <path d="M10 10 L18 6 L26 10 L26 20 Q26 28 18 31 Q10 28 10 20 Z"
              fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
        <path d="M14 18 L17 21 L22 15" stroke="white" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Tournamates
    </a>

    <nav class="navbar__nav">
      <a href="index.html" class="active">Home</a>
      <a href="teams.html">Teams</a>
      <a href="rounds.html">Rounds</a>
      <a href="jury.html">Jury</a>
      <a href="leaderboard.html">Leaderbord</a>
    </nav>

    <div class="navbar__user">
      <span>Name Surname</span>
      <div class="navbar__avatar">⭐</div>
    </div>
  </header>

  <!-- ═══ LOGIN PAGE ═══ -->
  <main class="login-page">
    <div class="login-card">

      <h1 class="login-card__title">Login</h1>

      <div class="login-form">

        <div class="login-field">
          <label for="name">Name Surname</label>
          <input id="name" type="text" placeholder="Type your surname" autocomplete="name" />
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Type your password" autocomplete="current-password" />
        </div>

        <a class="login-forgot" href="#">Forgot password?</a>

        <button class="btn btn--login" onclick="handleLogin()">login</button>

        <div class="login-socials">
          <!-- Google -->
          <button class="social-btn" title="Sign in with Google">
            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
          </button>

          <!-- Instagram -->
          <button class="social-btn" title="Sign in with Instagram">
            <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" style="stop-color:#f09433"/>
                  <stop offset="25%" style="stop-color:#e6683c"/>
                  <stop offset="50%" style="stop-color:#dc2743"/>
                  <stop offset="75%" style="stop-color:#cc2366"/>
                  <stop offset="100%" style="stop-color:#bc1888"/>
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="20" height="20" rx="5" fill="url(#ig)"/>
              <circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="1.8"/>
              <circle cx="17.5" cy="6.5" r="1.2" fill="white"/>
            </svg>
          </button>

          <!-- Apple -->
          <button class="social-btn" title="Sign in with Apple">
            <svg width="22" height="24" viewBox="0 0 22 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M18.05 12.6c-.03-3.1 2.53-4.6 2.65-4.67-1.44-2.11-3.68-2.4-4.48-2.43-1.91-.19-3.73 1.13-4.7 1.13-.97 0-2.47-1.1-4.06-1.07-2.1.03-4.03 1.22-5.12 3.1-2.18 3.79-.56 9.39 1.57 12.47 1.04 1.5 2.28 3.18 3.9 3.12 1.57-.06 2.16-1.01 4.06-1.01 1.89 0 2.43 1.01 4.07.98 1.68-.03 2.76-1.53 3.79-3.04 1.19-1.74 1.69-3.43 1.71-3.52-.04-.01-3.36-1.29-3.39-5.07z" fill="#1d1d1f"/>
              <path d="M14.9 3.6c.87-1.05 1.45-2.5 1.29-3.96-1.25.05-2.75.83-3.65 1.88-.8.93-1.5 2.42-1.31 3.84 1.39.11 2.81-.71 3.67-1.76z" fill="#1d1d1f"/>
            </svg>
          </button>
        </div>

        <a class="login-signup" href="signup.html">Sign up</a>

      </div>
    </div>
  </main>

  <script>
    function handleLogin() {
      const name = document.getElementById('name').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!name || !password) {
        alert('Будь ласка, заповніть всі поля.');
        return;
      }
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
