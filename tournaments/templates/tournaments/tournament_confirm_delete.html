<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видалити турнір</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Multi Tournament</a>

            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">Вітаємо, {{ user.username }}! ({{ user.get_role_display }})</span>
                    <a class="nav-link" href="{% url 'tournament_list' %}">Турніри</a>
                    <a class="nav-link" href="{% url 'profile' %}">Профіль</a>
                    <form action="{% url 'logout' %}" method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm">Вийти</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-danger">
                    <div class="card-header bg-danger text-white text-center">
                        <h4>Підтвердження видалення</h4>
                    </div>
                    <div class="card-body text-center">
                        <h5>Ви впевнені, що хочете видалити турнір?</h5>
                        <p class="lead"><strong>"{{ object.title }}"</strong></p>
                        
                        <form method="post" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger btn-lg me-3">
                                Так, видалити
                            </button>
                        </form>
                        <a href="{% url 'tournament_detail' object.id %}" class="btn btn-secondary btn-lg">
                            Скасувати
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
